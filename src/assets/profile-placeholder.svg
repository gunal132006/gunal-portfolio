<svg viewBox="0 0 300 375" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="375" fill="#f0ebe1"/>
  <!-- Sketch Portrait Silhouette -->
  <g stroke="#2f2f2f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Head Outline -->
    <path d="M150 70 C 120 70, 110 100, 110 135 C 110 170, 125 195, 150 200 C 175 195, 190 170, 190 135 C 190 100, 180 70, 150 70 Z" fill="#ffffff"/>
    <!-- Hair Doodle -->
    <path d="M115 110 C 110 85, 125 60, 150 58 C 175 60, 190 85, 185 110 C 175 90, 160 85, 150 85 C 140 85, 125 90, 115 110 Z" fill="#2f2f2f"/>
    <!-- Eyes / Glasses -->
    <ellipse cx="136" cy="130" rx="9" ry="7" fill="#f0ebe1" stroke="#2f2f2f" stroke-width="2"/>
    <ellipse cx="164" cy="130" rx="9" ry="7" fill="#f0ebe1" stroke="#2f2f2f" stroke-width="2"/>
    <path d="M145 130 L155 130" stroke="#2f2f2f" stroke-width="2"/>
    <circle cx="136" cy="130" r="2.5" fill="#2f2f2f"/>
    <circle cx="164" cy="130" r="2.5" fill="#2f2f2f"/>
    <!-- Smile -->
    <path d="M142 162 Q 150 170 158 162" stroke="#2f2f2f" stroke-width="2.5"/>
    <!-- Shoulders / Torso -->
    <path d="M90 270 C 95 220, 120 215, 150 215 C 180 215, 205 220, 210 270" fill="#ffffff"/>
    <path d="M135 215 L 140 240 L 150 250 L 160 240 L 165 215" fill="#e44242" fill-opacity="0.3"/>
  </g>
  <!-- Handwritten Placeholder Prompt -->
  <text x="150" y="315" font-family="'Architects Daughter', cursive" font-size="16" fill="#545454" text-anchor="middle" letter-spacing="1">
    [ Gunal's Photo Placeholder ]
  </text>
  <text x="150" y="340" font-family="'Reenie Beanie', cursive" font-size="20" fill="#264de4" text-anchor="middle">
    Drop profile.jpg into src/assets/
